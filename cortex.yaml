# Cortex configuration — generated by `cortex init`.
#
# Command verifiers stay blocked until the trusted process launching Cortex
# sets CORTEX_APPROVE_COMMANDS=1; repository configuration cannot approve
# itself. Review the argv below before enabling it.
verifiers:
  unit:
    argv: ["go", "test", "./..."]
    kind: unit_test
    surface: code
    timeout: 5m
