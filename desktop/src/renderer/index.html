<!doctype html>
<html lang="en" data-theme="dark" data-density="comfortable">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cortex Deck</title>
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/components.css" />
    <link rel="stylesheet" href="./styles/views.css" />
  </head>
  <body>
    <div id="app" class="app">
      <aside id="rail" class="rail" aria-label="Primary"></aside>
      <div class="stage">
        <header id="topbar" class="topbar"></header>
        <main id="view" class="view" tabindex="-1"></main>
      </div>
      <aside id="inspector" class="inspector" aria-label="Inspector" hidden></aside>
    </div>

    <div id="palette-root" class="palette-root" hidden></div>
    <div id="modal-root" class="modal-root" hidden></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <div id="boot" class="boot">
      <img class="boot-icon" src="./assets/icon.png" alt="" />
      <div class="boot-mark">cortex deck</div>
      <div class="boot-note">warming the kernel bridge…</div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
